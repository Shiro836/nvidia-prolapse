# cargo-deny policy (RUST.md §9).
[graph]
targets = ["x86_64-linux-android", "i686-linux-android", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Compatible with shipping inside an MIT project and Android vendor images.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
