[package]
name = "nv-bionic-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native NVIDIA RM backend, built directly against Android bionic"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "nv-native-check"
path = "src/main.rs"

[[bin]]
name = "nv-native-invariants"
path = "src/bin/nv-native-invariants.rs"
required-features = ["diagnostics"]

[[bin]]
name = "nv-native-perf-boost"
path = "src/bin/nv-native-perf-boost.rs"
required-features = ["diagnostics"]

[[bin]]
name = "nv-video-test"
path = "src/bin/nv-video-test.rs"

[[bin]]
name = "nv-video-avc-test"
path = "src/bin/nv-video-avc-test.rs"

[[bin]]
name = "nv-nvdec-probe"
path = "src/bin/nv-nvdec-probe.rs"

[dependencies]
nv-rm-abi = { path = "../rm-abi" }
nv-rm-core = { path = "../rm-core" }
nv-rm-sys = { path = "../rm-sys" }
nv-video = { path = "../video" }
zerocopy.workspace = true
log.workspace = true

[features]
# vast.ai hardware-invariant probe only; never enabled for the NVK bridge.
diagnostics = []

[lints]
workspace = true
