# Meson cross file: Android API 33, x86 (i686), NDK r30 (bionic).
# The NDK location is not typed here: the Makefile passes a generated cross file defining
# [constants] ndk = '<NDK>' first, and meson lets this file use it.
[binaries]
c       = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android33-clang'
ar      = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip   = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
# No host .pc file may leak into a bionic build; every pkg-config dependency is disabled anyway.
pkg-config = 'false'

[built-in options]
# -z defs: an unresolved symbol is a link error, not a surprise at dlopen time in the guest.
# -soname: on Android, upstream's meson.build links an *unversioned* libdrm.so (soname
# libdrm.so, meson.build "Build an unversioned so on android"); NVIDIA's driver dlopens the
# desktop name libdrm.so.2. lld keeps the last -soname, which is this one (checked by
# `make check` on the artifact, not assumed).
c_link_args = ['-Wl,-z,defs', '-Wl,--no-undefined', '-Wl,-soname,libdrm.so.2']

[host_machine]
system     = 'android'
cpu_family = 'x86'
cpu        = 'i686'
endian     = 'little'
