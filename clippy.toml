# Unsafe and panics are allowed in tests only through the test-specific
# switches below; library code gets the full workspace lint set.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true
# A SAFETY comment may sit on the statement (or above its attributes) that holds
# the unsafe block; this is the common convention and the one rustfmt keeps readable.
accept-comment-above-statement = true
accept-comment-above-attributes = true
